[project]
name = "harini-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anushmallya", email = "anushmallya.k@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
